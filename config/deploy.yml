# Name of your application. Used to uniquely configure containers.
service: shettar_super

# Name of the container image.
image: alexohre/shettar_super

# Deploy to these servers.
servers:
  web:
    - 49.13.95.30

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  hosts:
    - cmdc.shettar.com
  # Next.js standalone listens on 3000 (not 80).
  app_port: 3000
  # Default is /up (Rails). Next exposes app/up/route.ts for this.
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

deploy_timeout: 120
drain_timeout: 30

# Credentials for your image host (Docker Hub).
registry:
  username: alexohre
  password:
    - KAMAL_REGISTRY_PASSWORD

# Runtime process env (client NEXT_PUBLIC_* are baked at image build time via builder.args).
env:
  clear:
    NODE_ENV: production
    PORT: "3000"
    HOSTNAME: "0.0.0.0"

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  shell: app exec --interactive --reuse "sh"
  logs: app logs -f

# Build on the remote VPS (same host as shettar-web). Values from .kamal/secrets
# (reads local .env.production) — Kamal clones git and skips gitignored files.
builder:
  arch: amd64
  remote: ssh://root@49.13.95.30
  args:
    PNPM_VERSION: "10.28.1"
    NEXT_PUBLIC_API_URL: https://api-v1.shettar.com
    NEXT_PUBLIC_APP_ENV: production
    NEXT_PUBLIC_MARKETER_PORTAL_URL: <%= ENV.fetch("NEXT_PUBLIC_MARKETER_PORTAL_URL", "") %>
